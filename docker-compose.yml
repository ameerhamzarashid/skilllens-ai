services:
  postgres:
    image: postgres:16
    container_name: skilllens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skilllens_db
      POSTGRES_USER: skilllens_user
      POSTGRES_PASSWORD: skilllens_password
    ports:
      - "5433:5432"
    volumes:
      - skilllens_postgres_data:/var/lib/postgresql/data
    networks:
      - skilllens_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilllens_user -d skilllens_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skilllens_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: SkillLens AI
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg2://skilllens_user:skilllens_password@skilllens_postgres:5432/skilllens_db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml:/app/ml
    networks:
      - skilllens_network
    command: >
      sh -c "
      python -m data_platform.generate_sample_jobs &&
      python -m data_platform.ingest_jobs &&
      python -m skilllens.ml.train_salary_model &&
      python -m skilllens.ml.train_category_model &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: skilllens_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - skilllens_network

volumes:
  skilllens_postgres_data:

networks:
  skilllens_network:
    driver: bridge