name: SkillLens AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample data
        run: |
          python -m data_platform.generate_sample_jobs

      - name: Ingest sample data
        run: |
          python -m data_platform.ingest_jobs

      - name: Run data quality checks
        run: |
          python -m data_platform.data_quality

      - name: Train salary model
        run: |
          python -m skilllens.ml.train_salary_model

      - name: Train category model
        run: |
          python -m skilllens.ml.train_category_model

      - name: Run pytest
        run: |
          python -m pytest

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build